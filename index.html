<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116"><title>UNKNOWN — Interactive AU</title>
<style>
:root{color-scheme:dark;--glass:rgba(245,247,255,.16);--line:rgba(255,255,255,.22)}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;display:grid;place-items:center}.phone{position:relative;width:min(100vw,430px);height:min(100dvh,900px);min-height:620px;overflow:hidden;background:linear-gradient(160deg,#263346 0%,#18202d 42%,#07080d 100%);isolation:isolate}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 32%,#8792a0 0,#424c5b 23%,transparent 49%),linear-gradient(180deg,transparent 25%,rgba(5,7,13,.92) 82%);z-index:-1}.status{height:48px;padding:13px 24px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:116px;height:34px;border-radius:24px;background:#030405;box-shadow:0 2px 5px #0008}.lock{padding-top:42px;text-align:center;display:none}.lock .time{font-size:68px;letter-spacing:-3px;font-weight:250}.lock .date{font-size:17px}.unlock{position:absolute;bottom:35px;left:0;right:0;text-align:center;font-size:13px;color:#ddd}.unlock button{margin-top:14px;background:var(--glass);color:white;border:1px solid var(--line);border-radius:24px;padding:12px 25px}.home{padding:20px 21px 90px}.greeting{font-size:13px;letter-spacing:2px;color:#e2e6ec;margin-bottom:8px}.widget{padding:15px;border:1px solid var(--line);background:linear-gradient(135deg,#ffffff25,#ffffff0b);backdrop-filter:blur(24px);border-radius:24px;margin-bottom:22px;box-shadow:0 8px 28px #0002}.widget .date{font-size:12px;opacity:.8}.widget .big{font-size:28px;font-weight:600;margin:5px 0}.widget p{font-size:12px;margin:0;color:#d2d8e1}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px}.app{border:0;background:none;color:#fff;text-align:center;padding:0;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:6px}.ico{height:56px;width:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;box-shadow:0 5px 13px #0003;border:1px solid #ffffff35}.messages{background:linear-gradient(#63df80,#1ba84c)}.notes{background:linear-gradient(#fff6b9,#e8cf54);color:#34302a}.photos{background:#f3f4f8;color:#444}.safari{background:linear-gradient(#9be6ff,#3179d9)}.mail{background:linear-gradient(#8bd2ff,#2768dc)}.maps{background:linear-gradient(130deg,#8ce0b2,#f7e6a0,#89c4fa)}.camera{background:linear-gradient(#666,#18191c)}.settings{background:linear-gradient(#aeb9c7,#555e6c)}.phoneapp{background:#2fce6d}.files{background:linear-gradient(#82c9ff,#3172d7)}.insta{background:linear-gradient(135deg,#6536bf,#f84c77,#ffc25c)}.dock{position:absolute;bottom:17px;left:15px;right:15px;padding:13px 15px;display:flex;justify-content:space-around;gap:13px;border:1px solid var(--line);border-radius:28px;background:#ffffff20;backdrop-filter:blur(30px)}.dock .ico{width:52px;height:52px}.screen{position:absolute;inset:48px 0 0;background:#f4f4f8;color:#17171b;display:none;border-radius:26px 26px 0 0;overflow:auto;padding:18px 18px 40px}.screen.show{display:block}.screenhead{display:flex;align-items:center;gap:12px;margin:8px 0 20px}.back{border:0;background:#e6e6eb;border-radius:50%;width:35px;height:35px;font-size:23px}.screen h1{font-size:27px;margin:0}.sub{color:#73737b;font-size:13px}.bubble{padding:11px 14px;border-radius:18px;margin:10px 0;max-width:84%;font-size:15px;line-height:1.4}.incoming{background:#e3e3e8}.outgoing{background:#32c65b;color:white;margin-left:auto}.note{background:#fff5b9;padding:18px;border-radius:12px;line-height:1.55;white-space:pre-wrap}.photo{background:linear-gradient(145deg,#111923,#67717d,#111);height:210px;border-radius:12px;display:grid;place-items:center;font-size:60px;margin-bottom:12px}.browserbar{border-radius:12px;background:#e4e4e9;padding:12px;font-size:13px;color:#3a3a40;margin:12px 0}.clue{border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0;background:#fff}.clue button,.action{border:0;background:#17171b;color:white;padding:12px 16px;border-radius:12px;margin-top:10px}.bottomhint{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:10px;color:#ffffff99;pointer-events:none}.hidden{display:none!important}@media(min-width:431px){.phone{border-radius:36px;border:5px solid #24262c;height:min(850px,94dvh)}}
</style></head>
<body><main class="phone"><div class="wall"></div><div class="status"><span id="clock">20:30</span><span>◈ ▴ ▰ 4G ▰</span></div><div class="island"></div>
<section id="lock" class="lock"><div class="date">Selasa, 27 Oktober</div><div class="time" id="locktime">20:30</div><div class="unlock">Geser untuk membuka<br><button onclick="unlock()">Buka iPhone ↗</button></div></section>
<section id="home" class="home"><div class="greeting">SELASA, 27 OKTOBER</div><div class="widget"><div class="date">SELAMAT MALAM</div><div class="big">Kamu punya 1 pesan.</div><p>Jangan buka pesan dari nomor yang tidak dikenal.</p></div>
<div class="apps">
<button class="app" onclick="openApp('messages')"><span class="ico messages">●</span>Messages</button><button class="app" onclick="openApp('photos')"><span class="ico photos">🌈</span>Photos</button><button class="app" onclick="openApp('notes')"><span class="ico notes">▤</span>Notes</button><button class="app" onclick="openApp('safari')"><span class="ico safari">🧭</span>Safari</button>
<button class="app" onclick="openApp('mail')"><span class="ico mail">✉</span>Mail</button><button class="app" onclick="openApp('maps')"><span class="ico maps">🗺</span>Maps</button><button class="app" onclick="openApp('camera')"><span class="ico camera">◉</span>Camera</button><button class="app" onclick="openApp('settings')"><span class="ico settings">⚙</span>Settings</button>
<button class="app" onclick="openApp('files')"><span class="ico files">📁</span>Files</button><button class="app" onclick="openApp('insta')"><span class="ico insta">◎</span>Instagram</button><button class="app" onclick="openApp('phone')"><span class="ico phoneapp">☎</span>Phone</button><button class="app" onclick="openApp('mystery')"><span class="ico" style="background:#17171b">?</span>Unknown</button>
</div></section><div class="dock" id="dock"><button class="app" onclick="openApp('phone')"><span class="ico phoneapp">☎</span></button><button class="app" onclick="openApp('messages')"><span class="ico messages">●</span></button><button class="app" onclick="openApp('safari')"><span class="ico safari">🧭</span></button><button class="app" onclick="openApp('music')"><span class="ico" style="background:#f35b75">♫</span></button></div>
<section class="screen" id="screen"><div class="screenhead"><button class="back" onclick="goHome()">‹</button><div><h1 id="apptitle">Messages</h1><div class="sub" id="appsub">Terakhir aktif sekarang</div></div></div><div id="appcontent"></div></section><div class="bottomhint" id="hint">AU INTERAKTIF • DEMO PERTAMA</div></main>
<script>
const $=id=>document.getElementById(id);let clues=0;function unlock(){$('lock').style.display='none';$('home').style.display='block';$('dock').style.display='flex'}function goHome(){$('screen').classList.remove('show');$('home').style.display='block';$('dock').style.display='flex';$('hint').style.display='block'}function openApp(name){$('home').style.display='none';$('dock').style.display='none';$('screen').classList.add('show');$('hint').style.display='none';const titles={messages:'Messages',photos:'Photos',notes:'Notes',safari:'Safari',mail:'Mail',maps:'Maps',camera:'Camera',settings:'Settings',files:'Files',insta:'Instagram',phone:'Phone',mystery:'UNKNOWN',music:'Music'};$('apptitle').textContent=titles[name]||name;$('appsub').textContent='';let html='';if(name==='messages')html='<div class="sub">iMessage • Nomor Tidak Dikenal</div><div class="bubble incoming">Kamu sudah sampai rumah?</div><div class="bubble outgoing">Maaf, ini siapa?</div><div class="bubble incoming">Jangan lihat ke jendela.</div><div class="bubble incoming">Aku tahu kamu sedang membaca ini.</div><div class="bubble incoming">Buka Notes. Sekarang.</div><button class="action" onclick="openApp(\'notes\')">Buka Notes</button>';else if(name==='notes')html='<div class="note">CATATAN — 23.48\n\nKalau kamu menemukan HP ini, jangan telepon polisi.\n\nAda seseorang di luar rumah. Dia selalu muncul di foto, meskipun aku sendirian.\n\nPetunjuk pertama: cari nama jalan di Safari.\n\nJangan percaya pesan terakhir.</div>';else if(name==='photos')html='<div class="photo">◉</div><div class="clue"><b>IMG_1048.JPG</b><p class="sub">Hari ini, 23.47</p><p>Ada bayangan di belakang orang yang mengambil foto ini.</p><button onclick="found(1)">Periksa detail foto</button></div>';else if(name==='safari')html='<div class="browserbar">🔒 search.example / pencarian</div><div class="clue"><b>Riwayat pencarian</b><p>“Jalan Melati 17 kejadian malam”</p><button onclick="found(2)">Buka hasil pencarian</button></div><div class="clue"><b>Forum warga — 3 tahun lalu</b><p>Seorang penghuni rumah di Jalan Melati 17 menghilang. Ponselnya tidak pernah ditemukan.</p><button onclick="found(3)">Simpan petunjuk</button></div>';else if(name==='mail')html='<div class="clue"><b>Dari: dirimu sendiri</b><p>Subjek: Kalau aku lupa</p><p>Kalau kamu membaca ini, berarti dia sudah menemukanku. Kode pintu ada di Files.</p><button onclick="openApp(\'files\')">Buka Files</button></div>';else if(name==='files')html='<div class="clue">📁 On My iPhone<br><br>📄 jangan_buka.txt <button onclick="found(4)">Buka berkas</button></div>';else if(name==='maps')html='<div class="photo">📍</div><div class="clue">Jalan Melati 17<br><p>Lokasi terakhir perangkat ini.</p><button onclick="found(5)">Lihat detail lokasi</button></div>';else if(name==='camera')html='<div class="photo">◉</div><p>Kamera tidak dapat terhubung.</p><button class="action" onclick="openApp(\'photos\')">Lihat foto terakhir</button>';else if(name==='settings')html='<div class="clue">Apple ID<br><p>Perangkat ini memiliki 1 profil yang tidak dikenal.</p></div><div class="clue">Baterai <b>17%</b><p>Mode daya rendah aktif.</p></div>';else if(name==='insta')html='<div class="clue"><b>@melati17</b><p>Story baru • 1 menit lalu</p><p>“Kalau ada yang mengetuk tiga kali, jangan dibuka.”</p><button onclick="found(6)">Lihat story berikutnya</button></div>';else if(name==='phone')html='<div class="clue"><b>Panggilan terakhir</b><p>Nomor Tidak Dikenal — 23.48</p><button onclick="alert(\'Tidak ada jaringan.\')">Telepon kembali</button></div>';else if(name==='mystery')html='<div class="clue"><b>UNKNOWN</b><p>Beberapa hal seharusnya tidak ditemukan.</p><p id="progress">Petunjuk ditemukan: '+clues+'/5</p><button onclick="found(7)">Periksa perangkat</button></div>';else html='<div class="clue">Tidak ada lagu yang diputar.</div>';$('appcontent').innerHTML=html}function found(n){clues=Math.min(5,clues+1);const p=$('progress');if(p)p.textContent='Petunjuk ditemukan: '+clues+'/5';alert(n===4?'FILE TERBUKA: KODE PINTU 2317':'Petunjuk ditemukan ('+clues+'/5). Ada sesuatu yang berubah…');}function tick(){let d=new Date();let t=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});$('clock').textContent=t;$('locktime').textContent=t}tick();setInterval(tick,30000);
</script></body></html>
